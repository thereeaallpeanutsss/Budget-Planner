<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Inner Glass Ring -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Modern Budget / Wealth Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Central Hexagonal Diamond / Wallet shield -->
    <path d="M0 -120 L105 -55 L105 55 L0 120 L-105 55 L-105 -55 Z" fill="rgba(6, 78, 59, 0.45)" stroke="url(#glyphGrad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Upward Trend Arc & Dynamic Lines -->
    <path d="M-65 25 L-20 -20 L25 15 L70 -45" fill="none" stroke="#6ee7b7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrowhead -->
    <path d="M45 -45 L70 -45 L70 -20" fill="none" stroke="#6ee7b7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Currency / Value Core -->
    <circle cx="0" cy="50" r="16" fill="#ecfdf5" />
  </g>
</svg>
