    <!-- Prevent iOS bounce refresh if desired, allow smooth native touch gestures -->
    <!-- Inline Critical Styles: Prevents white screen flashes on any host before CSS bundle downloads -->
    <style>:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}*{-webkit-user-drag:none;box-sizing:border-box}html,body{color:#f1f5f9;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none;width:100%;height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background-color:#090d16!important}input,textarea,select{-webkit-user-select:auto;user-select:auto}#initial-loading-fallback{color:#10b981;z-index:99999;text-align:center;background-color:#090d16;flex-direction:column;justify-content:center;align-items:center;padding:24px;display:flex;position:fixed;inset:0}.zenith-spinner{border:3px solid #10b98126;border-top-color:#10b981;border-radius:50%;width:42px;height:42px;margin-bottom:16px;animation:.8s linear infinite zenith-spin}@keyframes zenith-spin{to{transform:rotate(360deg)}}.zenith-title{letter-spacing:.05em;color:#94a3b8;font-size:13px;font-weight:600}.zenith-recovery{color:#cbd5e1;background:#0f172a;border:1px solid #1e293b;border-radius:16px;max-width:320px;margin-top:24px;padding:16px;font-size:12px;display:none}.zenith-btn{color:#022c22;cursor:pointer;background:#10b981;border:none;border-radius:10px;margin-top:10px;padding:8px 16px;font-weight:600;text-decoration:none;display:inline-block}</style>

    <!-- GitHub Pages & Service Worker Bootstrap Guard -->
    <script>
      (function() {
        var l = window.location;
        var p = l.pathname;
        var h = l.hostname;

        // 1. Ensure trailing slash on GitHub Pages repository subpaths so relative assets ./assets/ resolve correctly
        if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
          l.replace(p + '/' + l.search + l.hash);
          return;
        }

        // 2. If hosted on GitHub Pages and this is the uncompiled root index.html,
        // automatically route to the pre-compiled /docs/ directory
        if (h.endsWith('github.io')) {
          window.addEventListener('DOMContentLoaded', function() {
            var isCompiled = document.querySelector('script[src*="assets/"]') !== null;
            if (!isCompiled && !p.includes('/docs')) {
              var target = p.endsWith('/') ? p + 'docs/' : p + '/docs/';
              l.replace(target + l.search + l.hash);
            }
          });
        }

        // 3. Stale cache / Service Worker watchdog: If app hasn't mounted in 3.5s, unregister old SW & show recovery
        setTimeout(function() {
          var fallback = document.getElementById('initial-loading-fallback');
          if (fallback && document.body.contains(fallback)) {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var r of regs) r.unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var k of keys) caches.delete(k);
              });
            }
            var rec = document.getElementById('zenith-recovery-box');
            if (rec) rec.style.display = 'block';
          }
        }, 3500);
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-Dv7p3SgU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DEmddeu9.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js" defer></script></head>
  <body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root" class="h-full w-full">
      <!-- Pre-hydration placeholder: Beautiful native dark iOS loader -->
      <div id="initial-loading-fallback">
        <div class="zenith-spinner"></div>
        <span class="zenith-title">Opening Zenith Budget...</span>

        <div id="zenith-recovery-box" class="zenith-recovery">
          <p style="margin: 0 0 8px 0; font-weight: 500;">Taking longer than usual?</p>
          <p style="margin: 0 0 12px 0; color: #94a3b8;">Old cache or network issue detected. Tap below to refresh.</p>
          <button class="zenith-btn" onclick="window.location.reload(true);">Reload Page</button>
        </div>
      </div>
    </div>
  </body>
</html>
