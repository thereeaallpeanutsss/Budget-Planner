<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Zenith Budget — iOS Offline Budget Planner</title>
    <meta
      name="description"
      content="Clean, privacy-first personal budget planner optimized for iOS & iPad with local accounts and offline backup & restore."
    />

    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZenithBudget" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#090d16" />

    <!-- Open Graph -->
    <meta property="og:title" content="Zenith Budget — iOS Offline Budget Planner" />
    <meta
      property="og:description"
      content="Clean, privacy-first personal budget planner optimized for iOS & iPad with local accounts and offline backup & restore."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />

    <!-- Prevent iOS bounce refresh if desired, allow smooth native touch gestures -->
    <style>
      /* Safe area insets support for iPhone Notch, Dynamic Island, and Home Indicator */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        overscroll-behavior-y: none;
      }
      input, textarea, select {
        user-select: auto;
      }
    </style>
  </head>
  <body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
