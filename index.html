<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Zenith Budget — iOS Offline Budget Planner</title>
    <meta
      name="description"
      content="Clean, privacy-first personal budget planner optimized for iOS & iPad with local accounts and offline backup & restore."
    />

    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZenithBudget" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#090d16" />

    <!-- Open Graph -->
    <meta property="og:title" content="Zenith Budget — iOS Offline Budget Planner" />
    <meta
      property="og:description"
      content="Clean, privacy-first personal budget planner optimized for iOS & iPad with local accounts and offline backup & restore."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />

    <!-- Prevent iOS bounce refresh if desired, allow smooth native touch gestures -->
    <!-- Inline Critical Styles: Prevents white screen flashes on any host before CSS bundle downloads -->
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * {
        -webkit-user-drag: none;
        box-sizing: border-box;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        height: 100%;
        height: 100dvh;
        height: -webkit-fill-available;
        background-color: #090d16 !important;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        overscroll-behavior-y: none;
      }
      input, textarea, select {
        user-select: auto;
      }
      #initial-loading-fallback {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #090d16;
        color: #10b981;
        z-index: 99999;
        padding: 24px;
        text-align: center;
      }
      .zenith-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(16, 185, 129, 0.15);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: zenith-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes zenith-spin {
        to { transform: rotate(360deg); }
      }
      .zenith-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #94a3b8;
      }
      .zenith-recovery {
        display: none;
        margin-top: 24px;
        max-width: 320px;
        padding: 16px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 16px;
        font-size: 12px;
        color: #cbd5e1;
      }
      .zenith-btn {
        display: inline-block;
        margin-top: 10px;
        padding: 8px 16px;
        background: #10b981;
        color: #022c22;
        font-weight: 600;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        text-decoration: none;
      }
    </style>

    <!-- GitHub Pages & Service Worker Bootstrap Guard -->
    <script>
      (function() {
        var l = window.location;
        var p = l.pathname;
        var h = l.hostname;

        // 1. Ensure trailing slash on GitHub Pages repository subpaths so relative assets ./assets/ resolve correctly
        if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
          l.replace(p + '/' + l.search + l.hash);
          return;
        }

        // 2. If hosted on GitHub Pages and this is the uncompiled root index.html,
        // automatically route to the pre-compiled /docs/ directory
        if (h.endsWith('github.io')) {
          window.addEventListener('DOMContentLoaded', function() {
            var isCompiled = document.querySelector('script[src*="assets/"]') !== null;
            if (!isCompiled && !p.includes('/docs')) {
              var target = p.endsWith('/') ? p + 'docs/' : p + '/docs/';
              l.replace(target + l.search + l.hash);
            }
          });
        }

        // 3. Stale cache / Service Worker watchdog: If app hasn't mounted in 3.5s, unregister old SW & show recovery
        setTimeout(function() {
          var fallback = document.getElementById('initial-loading-fallback');
          if (fallback && document.body.contains(fallback)) {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var r of regs) r.unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var k of keys) caches.delete(k);
              });
            }
            var rec = document.getElementById('zenith-recovery-box');
            if (rec) rec.style.display = 'block';
          }
        }, 3500);
      })();
    </script>
  </head>
  <body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root" class="h-full w-full">
      <!-- Pre-hydration placeholder: Beautiful native dark iOS loader -->
      <div id="initial-loading-fallback">
        <div class="zenith-spinner"></div>
        <span class="zenith-title">Opening Zenith Budget...</span>

        <div id="zenith-recovery-box" class="zenith-recovery">
          <p style="margin: 0 0 8px 0; font-weight: 500;">Taking longer than usual?</p>
          <p style="margin: 0 0 12px 0; color: #94a3b8;">Old cache or network issue detected. Tap below to refresh.</p>
          <button class="zenith-btn" onclick="window.location.reload(true);">Reload Page</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
